<style>

:root{

    --ink:#E7EAF1; --ink-soft:#B5BCCB; --muted:#8B94A7;
    --blue:#93ABFF; --on-blue:#0B1230; --blue-soft:#212C49; --hl:#2B3D6B;
    --red:#FF8D80; --red-soft:#3A2225; --green:#73D69E; --green-soft:#1A3225; --amber:#F0C25A; --amber-soft:#382F1E;
    --t-theo:#C6A6F2; --t-rk:#F0C25A; --t-fb:#5FD0CD; --t-mx:#FF8D80; --t-vg:#93ABFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F131B; --grid:#192030; --sheet:#161B26; --panel:#1C2230; --tab:#141925; --line:#2A3244; --rule:#242C3C;
  --ink:#E7EAF1; --ink-soft:#B5BCCB; --muted:#8B94A7;
  --blue:#93ABFF; --on-blue:#0B1230; --blue-soft:#212C49; --hl:#2B3D6B;
  --red:#FF8D80; --red-soft:#3A2225; --green:#73D69E; --green-soft:#1A3225; --amber:#F0C25A; --amber-soft:#382F1E;

.choice{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--sheet);cursor:pointer}

ol.path{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 14px}

.statement{font-family:var(--font-display);font-size:22px;line-height:1.32;padding:18px;border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--panel)}

<script>
/* =========================================================
   INHALTE – alles aus deinem Hefter (plus markiertes Zusatzwissen)
   ========================================================= */
const TOPICS = {
  theo:{name:"Theodizee"},
  rk:{name:"Religionskritik – Überblick"},
  fb:{name:"Feuerbach"},
  mx:{name:"Marx"},
  vg:{name:"Vergleich & Zusammenhänge"}
};

const OPS = {
  "nennen":{afb:"I",d:"Informationen ohne Erläuterung knapp aufzählen."},
  "definieren":{afb:"I",d:"Einen Begriff genau bestimmen: Was ist gemeint, welche Merkmale, ggf. Wortherkunft."},
  "wiedergeben":{afb:"I",d:"Inhalte mit eigenen Worten strukturiert darstellen – ohne eigene Wertung, mit Redewiedergabe (Konjunktiv)."},
  "zusammenfassen":{afb:"I",d:"Wesentliche Aussagen knapp, strukturiert und in eigenen Worten darstellen."},
  "beschreiben":{afb:"I",d:"Einen Sachverhalt in seinen Merkmalen sachlich darstellen."},
  "erklären":{afb:"II",d:"Einen Sachverhalt so darstellen, dass Gründe und Zusammenhänge verständlich werden."},
  "erläutern":{afb:"II",d:"Erklären und zusätzlich mit Beispielen oder Textbelegen veranschaulichen."},
  "charakterisieren":{afb:"II",d:"Typische Merkmale herausstellen und zu einem Gesamtbild verbinden."},
  "herausarbeiten":{afb:"II",d:"Aus dem Material Aspekte erkennen und darstellen, auch wenn sie dort nicht ausdrücklich genannt sind."},
  "vergleichen":{afb:"II",d:"Gemeinsamkeiten UND Unterschiede kriteriengeleitet darstellen und zu einem Ergebnis kommen."},
  "einordnen":{afb:"II",d:"Eine Position begründet in einen größeren Zusammenhang (Theorie, Epoche) stellen."},
  "beurteilen":{afb:"III",d:"Eine Aussage an Kriterien prüfen und zu einem begründeten Sachurteil kommen."},
  "bewerten":{afb:"III",d:"Wie beurteilen – zusätzlich mit offengelegten eigenen Wertmaßstäben."},
  "Stellung nehmen":{afb:"III",d:"Nach Abwägung von Pro und Contra eine eigene Position begründet vertreten."},
  "erörtern":{afb:"III",d:"Eine These durch Pro- und Contra-Argumente prüfen und zu einem begründeten Urteil kommen."},
  "sich auseinandersetzen":{afb:"III",d:"Eine Aussage kritisch prüfen und dazu eine eigene, begründete Position entwickeln."}
};

const CARDS = [
  // ---------- Theodizee ----------
  {id:"t1",topic:"theo",op:"definieren",q:"Definiere den Begriff „Theodizee“ – inklusive Wortherkunft.",
   a:"**Theodizee = Rechtfertigung Gottes angesichts des Leids in der Welt.** Griech. *theós* = Gott, *díke* = Gerechtigkeit/Rechtfertigung. (Zusatz: Der Begriff stammt von Leibniz, 1710.)",
   kp:["Rechtfertigung Gottes","angesichts des Leids / des Übels in der Welt","theós = Gott","díke = Gerechtigkeit / Rechtfertigung"]},
  {id:"t2",topic:"theo",op:"erklären",q:"Worin besteht das Theodizee-Problem?",
   a:"Gott gilt als **allmächtig, allwissend und allgütig**. Trotzdem gibt es Leid. Das ist ein **Widerspruch**: Ein allgütiger Gott würde Leid nicht wollen, ein allwissender wüsste davon, ein allmächtiger könnte es verhindern. Deshalb wird entweder **Gott selbst** oder zumindest **eines der Attribute infrage gestellt**.",
   kp:["Attribute: allmächtig, allwissend, allgütig","Leid existiert trotzdem","Widerspruch zwischen Attributen und Leid","Gott oder ein Attribut wird infrage gestellt"]},
  {id:"t3",topic:"theo",op:"nennen",q:"Nenne die drei Arten von Leid mit je einem Beispiel und ihrem Ursprung.",
   a:"**Physisches Leid** (Schmerz, Krankheit, Naturkatastrophen, Alter, Unfall) – weil der Mensch ein **Naturwesen** ist.\n**Metaphysisches Leid** (Frage nach dem Sinn, Angst, Trauer, Schuld, das Theodizee-Problem selbst) – weil der Mensch ein **endliches und unvollständiges Wesen** ist.\n**Leid durch böses Handeln** (Beleidigung, Krieg, Gewalt, Hass) – weil der Mensch ein **frei handelndes Wesen** ist.",
   kp:["Physisches Leid – Mensch als Naturwesen","Metaphysisches Leid – Mensch als endliches, unvollständiges Wesen","Leid durch böses Handeln – Mensch als frei handelndes Wesen","Zu jeder Art ein passendes Beispiel"]},
  {id:"t4",topic:"theo",op:"zusammenfassen",q:"Fasse den Grundgedanken der Privationsthese zusammen.",
   a:"Lat. **privatio = Mangel, Fehlen**. Leid bzw. das Schlechte ist **kein eigenständiges Phänomen**, sondern ein **Mangel am Guten**. Nur Gott ist das höchste, vollkommene Wesen – seine **Schöpfung kann nicht vollkommen sein**, sonst wäre sie **mit Gott identisch**. Alles neben Gott ist darum „weniger gut“, und das erscheint uns als Leid.",
   kp:["privatio = Mangel","Leid ist kein eigenständiges Phänomen, sondern Mangel am Guten","Schöpfung kann nicht vollkommen sein, sonst identisch mit Gott","Alles neben Gott ist „weniger gut“ – das erleben wir als Leid"]},
  {id:"t5",topic:"theo",op:"erklären",q:"Was meint Leibniz mit der „besten aller möglichen Welten“?",
   a:"**Gottfried Wilhelm Leibniz (1646–1716)**: Gott hätte als allmächtiges Wesen jede vorstellbare Welt schaffen können, hat aber wegen seiner **Güte** nur eine geschaffen – **die beste aller möglichen Welten**. Eine Welt ohne Leid ist zwar vorstellbar, aber **nicht besser** als unsere. Also muss das Leid **insgesamt einen positiven Nutzen** haben.",
   kp:["Allmacht: Gott hätte jede Welt schaffen können","Aus Güte wählte er die beste aller möglichen Welten","Eine leidfreie Welt wäre nicht besser","Das Leid hat insgesamt einen positiven Nutzen / höheren Zweck"]},
  {id:"t6",topic:"theo",op:"nennen",q:"Nenne möglichst viele Beispiele, welchen positiven Nutzen Leid haben könnte (Leibniz' Logik).",
   a:"Aus deinem Hefter: **Freude und Glück werden erst im Kontrast erkennbar**, **Wachstum/Reifung**, **Unrecht wird erkannt und bekämpft**. Weitere: Schmerz als **Warnsignal**, Leid weckt **Mitgefühl und Solidarität**, **Freiheit** gibt es nur mit der Möglichkeit des Bösen.",
   kp:["Glück/Freude werden im Kontrast erkennbar","Wachstum / Reifung","Unrecht erkennen und bekämpfen","Ein weiteres Beispiel (Warnsignal, Mitgefühl oder Freiheit)"]},
  {id:"t7",topic:"theo",op:"nennen",q:"Nenne die vier Lösungsansätze zum Theodizee-Problem aus dem Unterricht.",
   a:"1. **Privationsthese**: Leid ist Mangel am Guten.\n2. **Leibniz**: beste aller möglichen Welten – Leid dient einem höheren Zweck.\n3. **Es existiert kein Gott** – zumindest keiner, der zugleich allgütig, allwissend **und** allmächtig ist.\n4. **Zurückweisung als rationales Problem**: Die Frage lässt sich nicht mit Denken lösen – es geht nicht um Rationalität.",
   kp:["Privationsthese","Leibniz: beste aller möglichen Welten","Kein Gott (zumindest nicht mit allen drei Attributen)","Kein rational lösbares Problem"]},
  {id:"t8",topic:"theo",op:"erläutern",q:"Worum geht es in Elie Wiesels Text „Wo ist Gott?“ – und was zeigt er für das Theodizee-Problem?",
   a:"Wiesel schildert eine **Hinrichtung im KZ**: Drei Häftlinge werden erhängt, darunter ein **Kind**, das über eine halbe Stunde mit dem Tod ringt. Ein Mann fragt: **„Wo ist Gott?“** – eine innere Stimme antwortet: **„Dort hängt er, am Galgen.“** Der Text zeigt die Theodizee als **existenzielle**, nicht nur theoretische Frage; rationale Rechtfertigungen wirken hier zynisch. Die Antwort ist doppeldeutig: **Der Glaube an Gott stirbt** – oder **Gott leidet mit den Opfern**.",
   kp:["Hinrichtung eines Kindes im KZ","„Wo ist Gott?“ – „Dort hängt er, am Galgen“","Theodizee als existenzielle Frage, rationale Antworten versagen","Deutung: Gott ist „tot“ für den Glaubenden oder Gott leidet mit"]},
  {id:"t9",topic:"theo",op:"beurteilen",q:"Warum lässt sich Wiesels Erfahrung schlecht mit der Privationsthese oder mit Leibniz beantworten?",
   a:"Das Leid im KZ ist **kein bloßer Mangel am Guten**, sondern **geplantes, aktiv zugefügtes Böses** (Leid durch böses Handeln). Ein **„Nutzen“** (Wachstum, Kontrast zum Glück) wirkt angesichts des Todes eines Kindes **zynisch und unverhältnismäßig**. Deshalb liegen **Lösung 4** (nicht rational lösbar) oder **Lösung 3** (kein solcher Gott) näher.",
   kp:["Aktiv zugefügtes Böses ist mehr als ein „Mangel“","Ein Nutzen-Argument wirkt zynisch / unverhältnismäßig","Verweis auf Lösung 3 oder 4","Begründetes eigenes Urteil"]},
  // ---------- Religionskritik Überblick ----------
  {id:"r1",topic:"rk",op:"nennen",q:"Seit wann gibt es Religionskritik? (Übersicht: „wann“)",
   a:"Religionskritik ist **so alt wie die Religion selbst**. Beispiele: schon in der Antike (Propheten wie Amos kritisieren leeren Opferkult; Xenophanes: Menschen machen sich Götter nach ihrem Bild), über Luther (1517) und die Aufklärung bis zum **Höhepunkt im 19. Jahrhundert**: **Feuerbach (1841)** und **Marx (1844)**.",
   kp:["So alt wie die Religion selbst","Eine frühe Epoche/Beispiel (Antike, Propheten, Luther oder Aufklärung)","19. Jahrhundert: Feuerbach und Marx","Jahreszahlen grob richtig (1841 / 1844)"]},
  {id:"r2",topic:"rk",op:"nennen",q:"Nenne die vier Ansatzpunkte der Religionskritik.",
   a:"1. Kritik **des Glaubens selbst**\n2. Kritik **bestimmter Glaubensinhalte** oder ihrer **Interpretationen**\n3. Kritik der **religiösen Institutionen**\n4. Kritik der **negativen Auswirkungen** von Religion",
   kp:["Glaube selbst","Bestimmte Glaubensinhalte / Interpretationen","Religiöse Institutionen","Negative Auswirkungen von Religion"]},
  {id:"r3",topic:"rk",op:"nennen",q:"Welche zwei Ziele kann Religionskritik verfolgen? Gib je ein Beispiel. (Übersicht: „Ziel“)",
   a:"1. **Reform / Läuterung** der Religion: Sie soll sich auf das Gute besinnen, aufgeweckt werden, sich klarmachen, worum es eigentlich geht – Kritik **von innen** (z. B. **Luther**, Propheten wie Amos).\n2. **Abschaffung / Überwindung** der Religion – Kritik **von außen** (z. B. **Feuerbach, Marx**).",
   kp:["Reform / Läuterung der Religion","Abschaffung / Überwindung der Religion","Beispiel für Reform (z. B. Luther)","Beispiel für Abschaffung (z. B. Feuerbach oder Marx)"]},
  {id:"r4",topic:"rk",op:"erklären",q:"Was ist der Unterschied zwischen religiöser und „irreligiöser“ Kritik?",
   a:"**Religiöse Kritik** kommt **von innerhalb** der Religion und will sie verbessern (z. B. **Luther**). **Irreligiöse Kritik** kommt **von außerhalb** und stellt Religion grundsätzlich infrage (z. B. **Marx**: „Das Fundament der irreligiösen Kritik ist: Der Mensch macht die Religion …“).",
   kp:["Religiöse Kritik: von innen, Ziel Reform","Irreligiöse Kritik: von außen, grundsätzlich","Beispiel Luther","Beispiel Marx / Feuerbach"]},
  // ---------- Feuerbach ----------
  {id:"f1",topic:"fb",op:"nennen",q:"Wer war Ludwig Feuerbach? (Lebensdaten, Hauptwerk, Kernthese)",
   a:"Deutscher Philosoph, **1804–1872**. Hauptwerk: **„Das Wesen des Christentums“ (1841)**. Kernthese: die **Projektionsthese** – Gott ist das nach außen projizierte Wesen des Menschen.",
   kp:["1804–1872","„Das Wesen des Christentums“","1841","Projektionsthese"]},
  {id:"f2",topic:"fb",op:"erklären",q:"Erkläre mit Feuerbach, was Gott ist.",
   a:"„Das absolute Wesen, der Gott des Menschen, ist **sein eignes Wesen**.“ Gott ist das Wesen des Menschen, **abgesondert von den Schranken des Individuums**, **vergegenständlicht** und als **anderes Wesen angeschaut und verehrt**. Alle Bestimmungen Gottes sind Bestimmungen des menschlichen Wesens. Genauer: Gott ist das **vergegenständlichte Wesen des Verstandes**, „nur **Gegenstand des Denkens**“.",
   kp:["Gott ist das eigene Wesen des Menschen","Vergegenständlicht / als anderes Wesen angeschaut und verehrt","Bestimmungen Gottes = Bestimmungen des menschlichen Wesens","Vergegenständlichter Verstand / nur Gegenstand des Denkens"]},
  {id:"f3",topic:"fb",op:"charakterisieren",q:"Charakterisiere das „Wesen des Menschen“ im Sinne Feuerbachs – und grenze es vom Individuum ab.",
   a:"Das **Wesen des Menschen** ist das, **was den Menschen zum Menschen macht** – das Allgemeine der Gattung: **Verstand, Denken, Vernunft** (bei Feuerbach außerdem Wille und Liebe). Das **Individuum** ist der konkrete Einzelmensch mit **Schranken**: Vorlieben, Gefühle, Charakter, Schwächen, **Endlichkeit**. In Gott stellt sich der Mensch sein Wesen **ohne die Schranken des Individuums** vor.",
   kp:["Wesen = was den Menschen zum Menschen macht (Gattung)","Verstand / Vernunft / Denken (Wille, Liebe)","Individuum = begrenzt: Gefühle, Schwächen, Endlichkeit","Gott = Wesen ohne die Schranken des Individuums"]},
  {id:"f4",topic:"fb",op:"erklären",q:"Erkläre den Begriff „Projektion“ in Feuerbachs Religionskritik.",
   a:"Der Mensch **vergegenständlicht** sein eigenes Wesen (seine Vollkommenheit) und **projiziert es nach außen – „in den Himmel“ – als Gott**. Was er anbetet, ist in Wahrheit **er selbst**. Religion ist also „das **Verhalten des Menschen zu sich selbst**, zu seinem Wesen“ – nur **unbewusst**, als wäre es ein fremdes Wesen.",
   kp:["Eigenes Wesen wird nach außen verlagert","…und als Gott / fremdes Wesen vorgestellt und verehrt","Religion = Verhalten des Menschen zu sich selbst","Vorgang ist unbewusst"]},
  {id:"f5",topic:"fb",op:"erklären",q:"Was meint Feuerbach mit „Gegenstand“ bzw. „vergegenständlichen“?",
   a:"**Vergegenständlichen** heißt: Etwas Inneres (das eigene Wesen) wird **nach außen gestellt und sich gegenübergestellt**, als wäre es ein eigenständiges Wesen. Gott ist „nur **Gegenstand des Denkens**“ – unsinnlich, gestaltlos, abstrakt, nur durch Abstraktion und Verneinung (**via negationis**) erkennbar. Der Mensch macht also sein eigenes Denken zum Gegenstand.",
   kp:["Inneres wird nach außen gestellt","…als eigenständiges Gegenüber / anderes Wesen","Gott ist nur Gegenstand des Denkens","Unsinnlich, abstrakt, via negationis erkannt"]},
  {id:"f6",topic:"fb",op:"erläutern",q:"Warum sind Gott und Mensch bei Feuerbach „Extreme“?",
   a:"Der Mensch setzt Gott als ihm **entgegengesetztes Wesen**: Gott ist **das schlechthin Positive, der Inbegriff aller Realitäten**; der Mensch ist **das schlechtweg Negative, der Inbegriff aller Nichtigkeiten**. Alles Gute schreibt er Gott zu, sich selbst bleibt nur das Mangelhafte – das ist die Wurzel der Entfremdung.",
   kp:["Gott = Inbegriff aller Realitäten / das Positive","Mensch = Inbegriff aller Nichtigkeiten / das Negative","Der Mensch gibt alles Gute an Gott ab","Bezug zur Entfremdung"]},
  {id:"f7",topic:"fb",op:"erklären",q:"Was bedeutet „Entfremdung“ bei Feuerbach?",
   a:"Der Mensch **überträgt sein Gattungswesen** (Vernunft, Wille, Liebe) **auf Gott**. **Je mehr er Gott zuschreibt, desto ärmer wird er selbst.** Er steht seinem eigenen Wesen **fremd** gegenüber, als wäre es das eines anderen. Die Entfremdung ist **religiös / im Bewusstsein** – aufgehoben wird sie durch **Erkenntnis**, indem der Mensch die Projektion **zurücknimmt**.",
   kp:["Wesen wird auf Gott übertragen","Je reicher Gott, desto ärmer der Mensch","Eigenes Wesen erscheint fremd","Aufhebung durch Erkenntnis / Rücknahme der Projektion"]},
  {id:"f8",topic:"fb",op:"erläutern",q:"Welche Folgen hat Feuerbachs Projektionsthese für das Leben der Menschen?",
   a:"**Verhältnis zu Gott**: Gebet, Hoffnung auf Erlösung und ein Lenker der Geschichte verlieren ihre reale Grundlage.\n**Christliche Werte** (Nächstenliebe, Demut, Jenseitshoffnung) müssen neu begründet werden – nicht als göttliches Gebot, sondern als **menschliche Selbstverpflichtung**.\nBewertung offen: **Befreiung** (der Mensch wird selbst verantwortlich) oder **Verlust** (Trost, Halt, absolute Verbindlichkeit fallen weg).",
   kp:["Gebet / Erlösung / Lenker der Geschichte verlieren ihre Grundlage","Werte werden zur menschlichen Selbstverpflichtung","Befreiung: Mensch wird selbst verantwortlich","Verlust: Trost, Halt, Verbindlichkeit fallen weg"]},
  {id:"f9",topic:"fb",op:"erklären",q:"Was ist das Ziel von Feuerbachs Religionskritik?",
   a:"**Aufklärung über die Selbsttäuschung**: Der Mensch soll **erkennen**, dass er Gott selbst erschaffen hat, und die **Projektion zurücknehmen**. So gewinnt er sein Wesen zurück – die Liebe zu Gott wird zur **Liebe zum Menschen**. Ansatzpunkt ist das **Bewusstsein**.",
   kp:["Aufklärung / Erkenntnis","Projektion zurücknehmen","Mensch gewinnt sein Wesen zurück","Ansatzpunkt: Bewusstsein"]},
  // ---------- Marx ----------
  {id:"m1",topic:"mx",op:"nennen",q:"Wer war Karl Marx? (Lebensdaten und die Texte aus dem Unterricht)",
   a:"Deutscher Philosoph und Ökonom, **1818–1883**. Texte: **„Zur Kritik der Hegelschen Rechtsphilosophie. Einleitung“ (1844)** – „Opium des Volks“; **„Ökonomisch-philosophische Manuskripte“ (1844)** – Entfremdung; **„Thesen über Feuerbach“ (1845)**; mit **Friedrich Engels** (1820–1895) **„Die deutsche Ideologie“ (1845/46)** – materialistische Geschichtsauffassung.",
   kp:["1818–1883","Kritik der Hegelschen Rechtsphilosophie (1844) – Opium","Thesen über Feuerbach (1845)","Deutsche Ideologie mit Engels"]},
  {id:"m2",topic:"mx",op:"erläutern",q:"Erläutere: Religion ist „das Selbstbewusstsein und das Selbstgefühl des Menschen, der sich selbst entweder noch nicht erworben oder schon wieder verloren hat“ (Z. 5–7).",
   a:"Religion ist für Marx **kein Bewusstsein von Gott**, sondern ein (verzerrtes) **Bewusstsein des Menschen von sich selbst** – nach außen verlagert (**Anschluss an Feuerbach**). **„Noch nicht erworben“**: Der Mensch hat sein wahres Selbstverständnis (reale Lage, Möglichkeiten) noch nicht erkannt. **„Schon wieder verloren“**: Er hatte es, hat es unter **schlechten gesellschaftlichen Bedingungen** wieder eingebüßt. Marx spricht von einem **Mangel**, weil Religion ein **Symptom eines Defizits** ist, nicht bloß ein Irrtum.",
   kp:["Bewusstsein des Menschen von sich selbst, nicht von Gott (Anschluss an Feuerbach)","„Noch nicht erworben“: wahres Selbstverständnis fehlt noch","„Schon wieder verloren“: unter schlechten Bedingungen eingebüßt","Religion als Symptom eines Mangels, nicht bloß Irrtum"]},
  {id:"m3",topic:"mx",op:"erklären",q:"Was ist Religion im Wesentlichen für Marx? (Z. 7–15)",
   a:"**Staat und Sozietät produzieren die Religion**, ein **verkehrtes Weltbewusstsein**, weil sie eine **verkehrte Welt** sind. Religion ist die **„phantastische Verwirklichung des menschlichen Wesens“**, weil dieses keine wahre Wirklichkeit besitzt – sie **kompensiert** eine fehlende reale Verwirklichung. Das religiöse Elend ist **Ausdruck des wirklichen Elends und Protestation dagegen**. **„Opium des Volks“**: lindert den Schmerz, heilt aber nicht die Ursache, sondern verschleiert sie.",
   kp:["Verkehrte Welt erzeugt verkehrtes Weltbewusstsein","Phantastische Verwirklichung / Kompensation","Ausdruck des Elends UND Protest dagegen","Opium: Trost + Betäubung / Verschleierung"]},
  {id:"m4",topic:"mx",op:"erklären",q:"Erkläre die Opium-Metapher. Warum ist sie doppeldeutig?",
   a:"Opium **lindert Schmerz, heilt aber nicht** – es **betäubt**. So spendet Religion **Trost** („Seufzer der bedrängten Kreatur, Gemüt einer herzlosen Welt“), **verschleiert aber die Ursachen** des Elends und hält Menschen davon ab, ihre Lage zu ändern. Doppeldeutig: Religion hat eine **echte Funktion** (Trost, Protest) und **verhindert zugleich Veränderung**. Achtung: „Opium **des** Volks“ – das Volk greift selbst danach; es wird ihm nicht von oben verabreicht.",
   kp:["Lindert Schmerz / spendet Trost","Heilt nicht – Ursache bleibt","Betäubt / verschleiert und verhindert Veränderung","Doppelt: echte Funktion und zugleich Problem"]},
  {id:"m5",topic:"mx",op:"erläutern",q:"Welche Forderung ergibt sich für Marx aus der Religionskritik? Was meint er mit „Verhältnissen“? (Z. 16–28)",
   a:"Die **Aufhebung der Religion als illusorisches Glück** ist die **Forderung nach dem wirklichen Glück**. Wer die Illusionen aufgeben soll, muss **den Zustand aufgeben, der Illusionen braucht**. Religionskritik wird zur **Kritik des „Jammertales“** – zur Gesellschaftskritik. Sie endet im **„kategorischen Imperativ, alle Verhältnisse umzuwerfen, in denen der Mensch ein erniedrigtes, geknechtetes, verlassenes, verächtliches Wesen ist“**. **Verhältnisse** = die **gesellschaftlichen, ökonomischen und politischen Strukturen** (später: Produktionsverhältnisse), nicht private Umstände.",
   kp:["Illusorisches Glück aufheben = Forderung nach wirklichem Glück","Den Zustand aufgeben, der Illusionen braucht","Kategorischer Imperativ: alle Verhältnisse umwerfen","Verhältnisse = gesellschaftliche / ökonomische / politische Strukturen"]},
  {id:"m6",topic:"mx",op:"beschreiben",q:"Beschreibe Marx' Dreischritt von der Religionskritik zur Veränderung.",
   a:"1. **Religionskritik**: Religion ist menschengemacht, eine Illusion.\n2. **Aufdeckung der realen Ursache**: die „verkehrte Welt“ – Elend, Unterdrückung.\n3. **Forderung nach Veränderung der Verhältnisse** – nicht nur der Bewusstseinsinhalte.\nZusatz (Marx, gleicher Text): „Die Kritik des Himmels verwandelt sich damit in die Kritik der Erde.“",
   kp:["Religionskritik: Religion als Illusion","Aufdeckung der realen (gesellschaftlichen) Ursache","Veränderung der Verhältnisse","Nicht nur Bewusstsein, sondern Praxis"]},
  {id:"m7",topic:"mx",op:"charakterisieren",q:"Charakterisiere das Menschenbild von Marx („Deutsche Ideologie“, Z. 9–30).",
   a:"Der Mensch ist …\n1. ein **bedürftiges Naturwesen**: Er muss essen, trinken, wohnen, sich kleiden, bevor er „Geschichte machen“ kann (Z. 9–13);\n2. ein **tätiges, produzierendes Wesen**: Die **erste geschichtliche Tat** ist die Produktion der Mittel zur Bedürfnisbefriedigung (Z. 12–15);\n3. **geschichtlich veränderlich**: Befriedigte Bedürfnisse erzeugen **neue Bedürfnisse** (Z. 17–20);\n4. ein **soziales Wesen**: Familie als erstes soziales Verhältnis, später weitere (Z. 21–30). Diese „drei Seiten“ bestehen gleichzeitig, nicht als Stufen.\n**Kern**: kein abstraktes Einzelwesen, sondern durch **materielle Bedürfnisse, Arbeit und gesellschaftliche Verhältnisse** bestimmt.",
   kp:["Bedürftiges Naturwesen (Essen, Wohnen, Kleidung)","Tätig / produzierend – Arbeit als erste geschichtliche Tat","Neue Bedürfnisse → geschichtliche Entwicklung","Soziales Wesen (Familie, gesellschaftliche Verhältnisse)"]},
  {id:"m8",topic:"mx",op:"erklären",q:"Erkläre, warum Marx „(historischer) Materialist“ ist.",
   a:"**Materialist**: Das **materielle Sein bestimmt das Bewusstsein** – nicht umgekehrt. Am Anfang der Geschichte stehen keine Ideen oder Religionen, sondern die **Produktion des materiellen Lebens** (Z. 12–15). Gegenpol: **Idealismus (Hegel)**, nach dem der Geist die Geschichte antreibt. Religion, Recht und Moral sind **Folgen der Lebensverhältnisse**; Geschichte gibt es auch ohne „politischen oder religiösen Nonsens“ (Z. 45–47).\n**Historisch**: Diese Abhängigkeit **entwickelt sich in der Zeit**. Jede Produktionsweise ist mit einer bestimmten Form des Zusammenwirkens verbunden (Z. 36–41); ändern sich die Produktivkräfte, ändert sich die Gesellschaft. **Geschichte = Abfolge verschiedener Produktionsverhältnisse.**",
   kp:["Sein bestimmt Bewusstsein","Produktion des materiellen Lebens als Grundlage","Gegensatz zum Idealismus (Hegel)","Historisch: neue Bedürfnisse / Produktionsweisen verändern die Gesellschaft"]},
  {id:"m9",topic:"mx",op:"nennen",q:"Was ist laut Marx die „erste geschichtliche Tat“?",
   a:"Die **Erzeugung der Mittel zur Befriedigung der Grundbedürfnisse** (Essen, Trinken, Wohnung, Kleidung) – **die Produktion des materiellen Lebens selbst**. Außerdem: Die Befriedigung führt zu **neuen Bedürfnissen** – auch diese Erzeugung neuer Bedürfnisse nennt Marx „die erste geschichtliche Tat“.",
   kp:["Produktion der Mittel zur Bedürfnisbefriedigung","= Produktion des materiellen Lebens","Erzeugung neuer Bedürfnisse"]},
  {id:"m10",topic:"mx",op:"erklären",q:"Erkläre die dreifache Entfremdung bei Marx.",
   a:"Im **Kapitalismus** entfremdet sich der Mensch von sich selbst – dreifach:\n1. **Vom Produkt seiner Arbeit**: Durch Arbeitsteilung und weil die **Produktionsmittel dem Kapital gehören**, hat der Arbeiter keine Kontrolle und kein Anrecht auf sein Produkt (**der Fließbandarbeiter besitzt das Auto nicht**).\n2. **Von seiner Natur als freies Wesen**: Er muss seine **Arbeitskraft auf dem Markt verkaufen** und wird zur **„Marionette“** der Produktionsstrukturen; was produziert wird, bestimmen **Angebot und Nachfrage**.\n3. **Von seinen Mitmenschen** und damit von seiner Natur als soziales Wesen: Auf dem Arbeitsmarkt herrscht **Konkurrenz**, die jede soziale Beziehung „verseucht“.",
   kp:["Vom Produkt der Arbeit (Fließband-Beispiel, Produktionsmittel beim Kapital)","Von der Natur als freies Wesen (Arbeitskraft verkaufen, Marionette des Marktes)","Von den Mitmenschen / als soziales Wesen (Konkurrenz)","Ursache: Kapitalismus"]},
  {id:"m11",topic:"mx",op:"erläutern",q:"Wie lautet die 11. These über Feuerbach – und was bedeutet sie?",

  {id:"m12",topic:"mx",op:"beurteilen",q:"Beurteile, welche Rolle das „Wesen des Menschen“ bei Marx spielt.",
   a:"**Für eine zentrale Rolle**: Entfremdung setzt ein **eigentliches Wesen** voraus (freie, bewusste, gesellschaftliche Tätigkeit) – es ist der **Maßstab der Kapitalismuskritik**. Auch der kategorische Imperativ (Verhältnisse umwerfen, in denen der Mensch „erniedrigt“ ist) setzt voraus, dass der Mensch **anders sein könnte und sollte**.\n**Spannung**: Der historische Materialismus lehnt ein festes, abstraktes Wesen ab – **6. These**: Das menschliche Wesen ist **„das ensemble der gesellschaftlichen Verhältnisse“**. Wandelt sich das Wesen mit den Verhältnissen, ist unklar, woran Entfremdung gemessen wird.\n**Urteil**: unverzichtbar, aber nicht festgeschrieben – kritischer Maßstab, historisch statt metaphysisch bestimmt; zugleich die Schwachstelle.",

  {id:"v2",topic:"vg",op:"vergleichen",q:"Vergleiche, wie Feuerbach und Marx den Ursprung der Religion erklären.",
   a:"**Feuerbach**: Religion entsteht aus dem **Wesen des Menschen** – er projiziert seine Vollkommenheit (Vernunft, Wille, Liebe) auf Gott (**anthropologisch-psychologisch**). Er bleibt beim **Bewusstsein** stehen.\n**Marx** fragt weiter: **Warum** projiziert der Mensch? Weil die **Welt (Staat, Gesellschaft) verkehrt** ist und Elend erzeugt. Religion ist **Ausdruck materieller Not und gesellschaftlicher Verhältnisse**.",
   kp:["Feuerbach: Projektion des menschlichen Wesens","Feuerbach bleibt beim Bewusstsein","Marx fragt nach dem Warum","Marx: verkehrte gesellschaftliche / materielle Verhältnisse als Ursache"]},
  {id:"v3",topic:"vg",op:"vergleichen",q:"Vergleiche Ansatzpunkt und Ziel der Kritik bei Feuerbach und Marx.",
   a:"**Feuerbach** setzt beim **Bewusstsein / bei der Erkenntnis** an: Der Mensch soll erkennen, dass er Gott selbst erschafft. Ziel: **Aufklärung über die Selbsttäuschung, Rücknahme der Projektion**.\n**Marx** setzt bei der **gesellschaftlichen und ökonomischen Praxis** an: Die Verhältnisse, die Religion nötig machen, müssen sich ändern. Ziel: **politische und soziale Umwälzung** – dann wird Religion **überflüssig**.",
   kp:["Feuerbach: Bewusstsein / Erkenntnis","Feuerbach: Aufklärung, Projektion zurücknehmen","Marx: gesellschaftliche Praxis / Verhältnisse","Marx: Umwälzung – Religion wird überflüssig"]},
  {id:"v4",topic:"vg",op:"herausarbeiten",q:"Arbeite heraus, was Marx an Feuerbach kritisiert.",
   a:"Feuerbach hat gezeigt, dass die religiöse Welt auf die weltliche zurückgeht – ist aber **beim Interpretieren stehen geblieben** (**11. These**). Er erklärt nicht, **warum** die weltliche Grundlage überhaupt Religion hervorbringt – nämlich wegen ihrer **inneren Widersprüche** (**4. These**). Und er denkt den Menschen **abstrakt als Gattungswesen**, nicht als **gesellschaftlich und historisch** bestimmtes Wesen (**6. These**). Feuerbach bleibt also **unhistorisch und theoretisch**.",
   kp:["Nur interpretiert, nicht verändert (11. These)","Fragt nicht, warum die weltliche Grundlage Religion erzeugt","Abstraktes Menschenbild statt gesellschaftlicher Verhältnisse (6. These)","Unhistorisch / bleibt Theorie"]},
  {id:"v5",topic:"vg",op:"vergleichen",q:"Vergleiche den Begriff „Entfremdung“ bei Feuerbach und Marx.",
   a:"**Gemeinsam**: Der Mensch ist **von seinem eigenen Wesen getrennt**.\n**Feuerbach**: Entfremdung geschieht **im Bewusstsein (Religion)** – der Mensch überträgt sein Wesen auf Gott und verarmt; aufgehoben durch **Erkenntnis**.\n**Marx**: Entfremdung geschieht in der **materiellen Praxis (Arbeit, Kapitalismus)** – dreifach: vom Produkt, vom freien Wesen, von den Mitmenschen; aufgehoben nur durch **veränderte Verhältnisse**. Marx macht Entfremdung zu einem **gesellschaftlichen Problem**.",
   kp:["Gemeinsam: Trennung vom eigenen Wesen","Feuerbach: im Bewusstsein / in der Religion","Marx: in Arbeit / Ökonomie (dreifach)","Aufhebung: Erkenntnis vs. Veränderung der Verhältnisse"]},
  {id:"v6",topic:"vg",op:"vergleichen",q:"Vergleiche das Menschenbild von Feuerbach und Marx.",

   kp:["Feuerbach: Gattungswesen – Vernunft, Wille, Liebe","Feuerbach: abstrakt / zeitlos","Marx: bedürftig, arbeitend, sozial","Marx: gesellschaftlich und historisch bestimmt"]},
  {id:"v7",topic:"vg",op:"erklären",q:"Erkläre, wie Marx' Religionskritik und sein Materialismus zusammenhängen.",
   a:"Wenn das **materielle Sein das Bewusstsein bestimmt**, dann ist auch **Religion** (eine Form des Bewusstseins) ein **Produkt der materiellen Lebensverhältnisse**. Eine **verkehrte Welt** erzeugt ein **verkehrtes Weltbewusstsein**. Darum kann man Religion **nicht durch bloße Aufklärung** überwinden (gegen Feuerbach), sondern nur, indem man die **materiellen Verhältnisse ändert**.",
   kp:["Sein bestimmt Bewusstsein","Religion = Produkt der Verhältnisse","Verkehrte Welt → verkehrtes Weltbewusstsein","Folge: Verhältnisse ändern statt nur aufklären"]},
  {id:"v8",topic:"vg",op:"erläutern",q:"Erläutere den Zusammenhang zwischen Theodizee-Problem und Religionskritik.",
   a:"Das Theodizee-Problem ist ein klassischer **Anlass für Religionskritik**: Lässt sich Leid nicht mit einem allmächtigen, allwissenden, allgütigen Gott vereinbaren, liegt **Lösung 3** nahe – es gibt keinen (solchen) Gott. Feuerbach und Marx gehen weiter: Sie erklären, **warum Menschen trotzdem glauben**. Bei **Marx** bringt gerade das **Leid** Religion hervor („**Seufzer der bedrängten Kreatur**“) – als Trost und Protest. Statt Gott zu rechtfertigen, soll der **Mensch** das (gesellschaftlich verursachte) Leid **selbst beseitigen**.",

  {id:"opium",title:"Marx: Opium des Volks",src:"Karl Marx: Zur Kritik der Hegelschen Rechtsphilosophie. Einleitung (1844)",text:"Das Fundament der irreligiösen Kritik ist: Der [[Mensch]] macht die [[Religion]], die Religion macht nicht den Menschen. […] Dieser Staat, diese Sozietät produzieren die Religion, ein [[verkehrtes]] Weltbewusstsein, weil sie eine [[verkehrte]] Welt sind. […] Sie ist die [[phantastische|fantastische]] Verwirklichung des menschlichen Wesens, weil das menschliche Wesen keine wahre [[Wirklichkeit]] besitzt. […] Das religiöse Elend ist in einem der [[Ausdruck]] des wirklichen Elendes und in einem die [[Protestation|Protest]] gegen das wirkliche Elend. Die Religion ist der [[Seufzer]] der bedrängten Kreatur, das [[Gemüt]] einer herzlosen Welt, wie sie der Geist geistloser Zustände ist. Sie ist das [[Opium]] des Volks. Die Aufhebung der Religion als des [[illusorischen]] Glücks des Volkes ist die Forderung seines [[wirklichen]] Glücks."},

  {id:"theodizee",title:"Theodizee: Grundbegriffe",src:"Arbeitsblatt „Das Theodizee-Problem“ und Hefter",text:"„Theodizee“ kommt von griech. [[theós|theos]] = Gott und [[díke|dike]] = Gerechtigkeit und bedeutet [[Rechtfertigung]] Gottes angesichts des [[Leids|Leides|Leid]] in der Welt. Das Problem: Gott gilt als [[allmächtig|@attr]], [[allwissend|@attr]] und [[allgütig|@attr]] – trotzdem gibt es Leid. Die Privationsthese (lat. [[privatio]] = Mangel) deutet das Leid als [[Mangel]] am Guten; wäre die Schöpfung vollkommen, wäre sie mit Gott [[identisch]]. [[Leibniz]] (1646–1716) behauptet, Gott habe die [[beste]] aller möglichen Welten geschaffen."},
  {id:"thesen",title:"Marx: Thesen & Materialismus",src:"Thesen über Feuerbach (1845), Deutsche Ideologie (1845/46)",text:"11. These: Die Philosophen haben die Welt nur verschieden [[interpretiert]]; es kommt darauf an, sie zu [[verändern]]. – 6. These: Das menschliche Wesen ist kein dem einzelnen Individuum inwohnendes [[Abstraktum]]. In seiner Wirklichkeit ist es das [[ensemble|Ensemble]] der gesellschaftlichen [[Verhältnisse]]. – Materialismus: Das [[Sein]] bestimmt das [[Bewusstsein|Bewußtsein]]. – Die erste geschichtliche Tat ist die [[Erzeugung|Produktion]] der Mittel zur Befriedigung der [[Bedürfnisse]]."},
  {id:"leid",title:"Leidarten & Entfremdung",src:"Hefter: Tabelle „Leid“ und Text „Wie der Mensch sich selbst verliert“",text:"Physisches Leid entsteht, weil der Mensch ein [[Naturwesen]] ist; metaphysisches Leid, weil er ein [[endliches]] und unvollständiges Wesen ist; Leid durch böses Handeln, weil er ein [[frei]] handelndes Wesen ist. – Marx: Im Kapitalismus entfremdet sich der Mensch vom [[Produkt]] seiner Arbeit, von seiner Natur als [[freies]] Wesen und von seinen [[Mitmenschen]], weil auf dem Arbeitsmarkt [[Konkurrenz]] herrscht."},
  {id:"daten",title:"Wann? Die wichtigsten Daten",src:"Übersicht – wann",text:"Feuerbach lebte von [[1804]] bis [[1872]]; „Das Wesen des Christentums“ erschien [[1841]]. Marx lebte von [[1818]] bis [[1883]]; die Einleitung zur Kritik der Hegelschen Rechtsphilosophie („Opium des Volks“) erschien [[1844]], die Thesen über Feuerbach schrieb er [[1845]]. Leibniz lebte von [[1646]] bis [[1716]]. Religionskritik ist so alt wie die [[Religion]] selbst."}
];

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k];
    if(v==null || v===false) continue;
    if(k==="class") el.className = v;
    else if(k==="html") el.innerHTML = v;
    else if(k==="style") el.style.cssText = v;
    else if(k.startsWith("on") && typeof v==="function") el.addEventListener(k.slice(2), v);
    else if(k==="value" || k==="checked") el[k] = v;
    else el.setAttribute(k, v===true ? "" : String(v));
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null || kid===false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}
function lev(a,b){
  const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
// 2 = exakt, 1 = Tippfehler, 0 = falsch
function matchAnswer(input, alts){
  const u = norm(input); if(!u) return 0;
  let best = 0;
  for(const a of alts){
    const v = norm(a);
    if(u===v) return 2;
    const tol = v.length>=10 ? 2 : v.length>=5 ? 1 : 0;
    if(tol && lev(u,v)<=tol) best = 1;
  }
  return best;
}

        try{ S = Object.assign(fresh(), JSON.parse(d.json)); localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
        if(currentRoute()==="start") render();
      } else if((S.updatedAt||0) > (d.updatedAt||0)) pushRemote();
    } else if(S.updatedAt) pushRemote();
    updateHeader();
  }catch(e){ remoteRef = null; syncState = "local"; updateHeader(); }
}

function aiError(e){
  const c = e && e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){
    AI = null; document.documentElement.classList.remove("has-ai"); updateHeader();
    return "KI-Feedback ist hier nicht freigegeben. Nutze die Checkliste zur Selbstkontrolle.";
  }
  const m = {
    cancelled:"",
    rate_limited:"Gerade zu viele Anfragen. Warte eine Minute und tippe dann noch einmal.",
    session_expired:"Deine Anmeldung ist abgelaufen. Melde dich neu an und versuch es dann noch einmal.",
    invalid_json:"Die Korrektur kam unvollständig an. Tippe noch einmal auf den Button.",
    refused:"Diese Eingabe wurde nicht bewertet. Formuliere sie um und versuch es erneut.",
    empty_completion:"Keine Antwort erhalten. Versuch es noch einmal.",
    prompt_too_large:"Der Text ist zu lang für eine Korrektur. Kürze ihn etwas."
  };
  return (c in m) ? m[c] : "Verbindungsproblem. Versuch es gleich noch einmal.";

function checklist(items, saved, onChange){
  const vals = items.map((_,i)=> (saved && saved[i]) || 0);
  const rows = [];
  const list = h("ul",{class:"checklist"}, items.map((it,i)=>{
    const id = uid("ck");
    const cb = h("input",{type:"checkbox",id});
    const li = h("li",null, cb, h("label",{for:id, html:md(it)}));
    cb.addEventListener("change", ()=>{ vals[i] = cb.checked ? 1 : 0; paint(i); onChange && onChange(vals, false); });
    rows.push({cb, li}); return li;
  }));
  function paint(i){ const {cb, li} = rows[i]; cb.checked = vals[i]===1; cb.indeterminate = vals[i]===0.5; li.classList.toggle("hit", vals[i]===1); li.classList.toggle("half", vals[i]===0.5); }
  items.forEach((_,i)=>paint(i));
  list.setVals = (nv, silent) => { nv.forEach((v,i)=>{ vals[i]=v; paint(i); }); onChange && onChange(vals, !!silent); };
  list.vals = vals;
  return list;
}
const score = vals => vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;

function timer(minutes){
  let left = minutes*60, iv = null;
  const disp = h("span",{class:"timer-disp"}, fmtTime(left));
  const btn = h("button",{class:"btn small sec",type:"button"}, "Timer starten");
  btn.addEventListener("click", ()=>{
    if(iv){ clearInterval(iv); iv=null; btn.textContent="Weiter"; return; }
    btn.textContent = "Pause";
    iv = setInterval(()=>{ left--; if(left<=0){ clearInterval(iv); iv=null; disp.textContent="Zeit um"; disp.classList.add("over"); btn.hidden=true; return; } disp.textContent = fmtTime(left); }, 1000);
  });
  onCleanup(()=>{ if(iv) clearInterval(iv); });
  return h("span",{class:"timer"}, disp, btn);
}

  root.append(h("div",{class:"stack tight"}, h("h2",null,"Textarbeit"), h("p",{class:"lede"},"Zusammenhänge erkennen heißt: die richtige Stelle finden und mit Zeilenangabe belegen. Tippe im Text auf den Satz, der die Frage beantwortet. Danach formulierst du den Zusammenhang selbst.")));

    return;
  }
  const t = TEXTS.find(x=>x.id===textSess.id), s = textSess;
  const head = h("div",{class:"row between",style:"margin-top:12px"}, h("h3",null,t.title), h("button",{class:"btn ghost small",type:"button",onclick:()=>{ textSess=null; render(); }},"Andere Texte"));
  if(s.phase==="write"){
    root.append(h("div",{class:"stack"}, head,
      h("details",{class:"more",open:true}, h("summary",null,"Text einblenden"), readerEl(t,false)),
      writingTask({key:"text-"+t.id, op:t.write.op, task:t.write.task, horizon:t.write.horizon, topics:t.write.topics, materialText:t.sections.map(sec=>sec.sents.map(x=>"(Z. "+x[1]+") "+x[2]).join(" ")).join("\n"), timer:20}),
      h("div",{class:"row"}, h("button",{class:"btn ghost",type:"button",onclick:()=>{ textSess={id:t.id,i:0,tries:0,first:0,phase:"find"}; render(); }},"Stellensuche wiederholen"))));
    return;
  }
  const task = t.tasks[s.i];
  const fb = h("div",{class:"stack tight","aria-live":"polite"});
  const next = h("button",{class:"btn small",type:"button",hidden:true}, s.i+1<t.tasks.length ? "Nächste Frage" : "Weiter zur Schreibaufgabe");
  next.addEventListener("click", ()=>{ if(s.i+1<t.tasks.length){ s.i++; s.tries=0; s.solved=false; render(); } else { const pct=Math.round(100*s.first/t.tasks.length); if(S.texts[t.id]==null || pct>S.texts[t.id]){ S.texts[t.id]=pct; save(); } s.phase="write"; render(); } });
  const firstEl = h("span",{class:"small muted"}, s.first+" auf Anhieb");
  const box = h("div",{class:"taskbox stack tight"}, h("div",{class:"row between"}, h("span",{class:"small muted"},"Frage "+(s.i+1)+" von "+t.tasks.length), firstEl), h("p",{class:"q"}, task.q), fb, h("div",{class:"row"}, next));
  const reader = readerEl(t, true);
  function showSolved(el){
    reader.querySelectorAll(".sent").forEach(x=>{ if(task.ok.includes(x.dataset.id)) x.classList.add("ok"); });
    const z = (el || reader.querySelector('.sent[data-id="'+task.ok[0]+'"]')).dataset.z;
    fb.replaceChildren(h("span",{class:"note "+(s.okFirst?"ok":"")}, s.okFirst ? "Genau." : "Hier steht's:"), h("p",{class:"small"}, task.x), h("p",{class:"small"}, h("strong",null,"So belegst du es: "), "(", zCite(z), ")"));
    firstEl.textContent = s.first+" auf Anhieb";
    next.hidden=false;
  }
  function solve(okFirst, el){ s.solved = true; s.okFirst = okFirst; if(okFirst) s.first++; showSolved(el); }
  reader.addEventListener("click", e=>{
    const el = e.target.closest(".sent"); if(!el || s.solved) return;
    if(task.ok.includes(el.dataset.id)){ solve(s.tries===0, el); return; }
    s.tries++; el.classList.add("bad"); setTimeout(()=>el.classList.remove("bad"), 900);
    if(s.tries>=3) solve(false);
    else fb.replaceChildren(h("span",{class:"note"}, "Nicht diese Stelle."), s.tries>=2 ? h("p",{class:"small"}, "Tipp: "+task.hint) : null);
  });
  reader.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("sent")){ e.preventDefault(); e.target.click(); } });
  root.append(h("div",{class:"stack"}, head, box, reader));
  if(s.solved) showSolved(null);
}

// ---------- Prüfungsgespräch ----------
let chat = {topic:"all", turns:[], busy:false, ctl:null};
const CHAT_TOPICS = {all:["Alles gemischt",["theo","rk","fb","mx","vg"]], theo:["Theodizee",["theo"]], rk:["Religionskritik & Feuerbach",["rk","fb","vg"]], mx:["Marx",["mx","vg"]], vg:["Vergleich Feuerbach – Marx",["fb","mx","vg"]]};
function chatRules(){
  const [name, topics] = CHAT_TOPICS[chat.topic];
  return "Du bist Prüfer in einer mündlichen Ethik-Prüfung (Klasse 12, Gymnasium, Deutschland). Thema: "+name+".\n"+
  "Grundlage ist ausschließlich dieses Unterrichtswissen:\n"+kb(topics)+"\n\n"+
  "Ablauf: Stelle immer genau EINE Frage. Nach jeder Antwort des Schülers: (1) Bewertung als erstes Wort: „Richtig.“, „Teilweise.“ oder „Falsch.“ (2) In 1–3 Sätzen, was gefehlt hat oder falsch war, mit der korrekten Information. (3) Dann die nächste Frage. "+
  "Steigere die Schwierigkeit: erst Wissen (nennen, erklären), dann Zusammenhänge (vergleichen, Textbezug), dann Urteil (Stellung nehmen). Hake bei vagen Antworten einmal nach, bevor du weitergehst. "+
  "Nach der achten Frage: kurzes Gesamtfeedback mit zwei Stärken und zwei Lücken, keine weitere Frage. Verrate keine Antwort, bevor der Schüler geantwortet hat. Deutsch, Du-Form, knapp, ohne Markdown-Überschriften.\n\nBeginne jetzt mit der ersten Frage.";
}
function viewChat(root){
  root.append(h("div",{class:"stack tight"}, h("h2",null,"Prüfungsgespräch"), h("p",{class:"lede"},"Claude fragt dich ab wie in einer mündlichen Prüfung: eine Frage, deine Antwort, sofortiges Feedback, dann die nächste – zunehmend schwieriger.")));
  if(!AI){ root.append(h("div",{class:"panel",style:"margin-top:14px"}, h("p",null,"Das Prüfungsgespräch braucht die KI-Funktion. Sie ist nur verfügbar, wenn du die App in Claude öffnest und die Nutzung erlaubst. Alle anderen Übungen funktionieren ohne."))); return; }
  const log = h("div",{class:"chat"});
  const paint = () => { log.replaceChildren(...chat.turns.map(m=>h("div",{class:"msg "+(m.role==="user"?"me":"ai")}, h("span",{class:"who"}, m.role==="user"?"Du":"Prüfer"), m.content))); };
  paint();
  const status = h("p",{class:"small muted","aria-live":"polite"});
  const ta = h("textarea",{id:"chat-in",rows:4,placeholder:"Deine Antwort …"});
  const send = h("button",{class:"btn",type:"button"}, "Antwort senden");
  const stop = h("button",{class:"btn ghost small",type:"button",hidden:true}, "Abbrechen");
  async function ask(){
    chat.busy = true; send.disabled = true; stop.hidden = false;
    const bubble = h("div",{class:"msg ai"}, h("span",{class:"who"},"Prüfer"), h("span",{class:"thinking"},"denkt nach"));
    log.append(bubble); bubble.scrollIntoView({block:"nearest"});
    chat.ctl = new AbortController();
    const recent = chat.turns.slice(-24);
    if(recent.length && recent[0].role!=="assistant") recent.shift();
    const input = [{role:"user", content:chatRules()}].concat(recent);
    try{
      const {text} = await AI(input, {cache:false, signal:chat.ctl.signal, onText:({text})=>{ bubble.replaceChildren(h("span",{class:"who"},"Prüfer"), text); }});
      chat.turns.push({role:"assistant", content:text});
    }catch(e){ bubble.remove(); const m = aiError(e); if(m) status.textContent = m; if(chat.turns.length && chat.turns[chat.turns.length-1].role==="user") ta.value = chat.turns.pop().content; }
    finally{ chat.busy=false; send.disabled=false; stop.hidden=true; paint(); }
  }
  send.addEventListener("click", ()=>{ const v=ta.value.trim(); if(!v || chat.busy) return; chat.turns.push({role:"user",content:v}); ta.value=""; status.textContent=""; paint(); ask(); });
  stop.addEventListener("click", ()=> chat.ctl && chat.ctl.abort());
  const chips = h("div",{class:"row"}, Object.entries(CHAT_TOPICS).map(([k,[name]])=>h("button",{class:"chip vg",type:"button","aria-pressed":String(chat.topic===k),onclick:()=>{ if(chat.busy) return; chat.topic=k; chat.turns=[]; render(); }}, name)));
  const startBtn = h("button",{class:"btn",type:"button"}, chat.turns.length ? "Neu starten" : "Prüfung starten");
  startBtn.addEventListener("click", ()=>{ if(chat.busy) return; chat.turns=[]; paint(); inputRow.hidden=false; ask(); });
  const inputRow = h("div",{class:"stack tight",hidden:!chat.turns.length}, ta, h("div",{class:"row"}, send, stop));
  root.append(h("div",{class:"stack",style:"margin-top:14px"}, chips, h("div",{class:"row"}, startBtn), log, status, inputRow));
}
